<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Sorter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root {
  --paper: #eceee9; --surface: #ffffff; --sunk: #f4f6f2;
  --ink: #151a18; --soft: #5c6764; --line: #d5dad4; --line-soft: #e4e8e1;
  --accent: #14594a; --accent-soft: #d9e8e2; --danger: #9b1c33;
  --shadow: 0 1px 2px rgba(21,26,24,.06), 0 8px 24px -16px rgba(21,26,24,.3);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1211; --surface: #151c1a; --sunk: #111817;
    --ink: #e7ebe8; --soft: #93a09c; --line: #29332f; --line-soft: #1f2724;
    --accent: #57b79f; --accent-soft: #16302a; --danger: #e8798d;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"] {
  --paper: #0d1211; --surface: #151c1a; --sunk: #111817;
  --ink: #e7ebe8; --soft: #93a09c; --line: #29332f; --line-soft: #1f2724;
  --accent: #57b79f; --accent-soft: #16302a; --danger: #e8798d;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
}
* { box-sizing: border-box; }
body {
  margin: 0; padding-block: 44px 64px; padding-left: 20px; padding-right: 20px;
  background: var(--paper); color: var(--ink);
  font: 400 15px/1.5 "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
.tagline { margin: -14px 0 0; color: var(--soft); font-size: 14px; }

#drop {
  border: 1.5px dashed var(--line); border-radius: 12px; background: var(--surface);
  padding: 44px 22px; text-align: center; display: flex; flex-direction: column;
  align-items: center; gap: 14px; transition: border-color .15s, background .15s; cursor: pointer;
}
#drop.over { border-color: var(--accent); background: var(--accent-soft); }
#drop strong { font-size: 17px; }
#drop .formats { font: 400 12.5px/1 "IBM Plex Mono", ui-monospace, monospace; color: var(--soft); letter-spacing: .04em; }

button {
  font: 500 14px/1 "IBM Plex Sans", system-ui, sans-serif; cursor: pointer;
  border-radius: 7px; padding: 10px 16px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink);
}
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--paper); }
button.primary:hover { filter: brightness(1.1); }
button.mini { padding: 5px 10px; font-size: 12.5px; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#results[hidden] { display: none !important; }
#results { display: flex; flex-direction: column; gap: 22px; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 1px;
  background: var(--line-soft); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stat { background: var(--surface); padding: 15px 18px; display: flex; flex-direction: column; gap: 3px; }
.stat .n { font: 600 25px/1 "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
.stat .k { font-size: 12px; color: var(--soft); }
.stat.flag .n { color: var(--danger); }

.bar-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: none; border-radius: 0; background: var(--surface); padding: 8px 14px; font-size: 13.5px; color: var(--soft); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--paper); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font: 500 11px/1 "IBM Plex Mono", ui-monospace, monospace;
  letter-spacing: .1em; text-transform: uppercase; color: var(--soft);
  padding: 13px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--sunk); }
td { padding: 11px 16px; border-bottom: 1px solid var(--line-soft); }
tr:last-child td { border-bottom: none; }
td.name { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 13px; word-break: break-all; }
td.num { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; text-align: right; width: 1%; white-space: nowrap; }
td.act { text-align: right; width: 1%; white-space: nowrap; }
td.act button + button { margin-left: 6px; }
.tag { display: inline-block; margin-left: 8px; font-family: "IBM Plex Sans", sans-serif;
  font-size: 11px; padding: 2px 8px; border-radius: 20px; background: var(--accent-soft); color: var(--accent); }

.check { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--soft); cursor: pointer; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }
.msg { font-size: 13px; color: var(--soft); }
.msg.bad { color: var(--danger); }
@media (max-width: 520px) { td.act button + button { margin: 6px 0 0 0; display: block; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">

<h1>Lead Sorter</h1>
<p class="tagline">Upload a list. Get one clean file per domain.</p>

<div id="drop" tabindex="0" role="button" aria-label="Upload a file">
  <strong>Drop your file here</strong>
  <button type="button" class="primary" id="browse">Choose file</button>
  <span class="formats">CSV · TSV · TXT · XLSX · XLS</span>
</div>

<div id="results" hidden>
  <div class="stats" id="stats"></div>

  <div class="bar-row">
    <div class="seg">
      <button type="button" id="by-domain" aria-pressed="true">By domain</button>
      <button type="button" id="by-provider" aria-pressed="false">By provider</button>
    </div>
    <label class="check"><input type="checkbox" id="skip-roles"> Leave out shared inboxes</label>
    <div style="display:flex;gap:8px">
      <button type="button" id="all-dl" class="primary">Download all</button>
      <button type="button" id="all-copy">Copy all</button>
    </div>
  </div>

  <div class="panel"><table id="groups"></table></div>
  <p class="msg" id="msg"></p>
</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

/* ---------- read any table format ---------- */
function detectDelimiter(line) {
  const c = [",",";","\t","|"].map(d => [d, line.split(d).length]).sort((a,b) => b[1]-a[1]);
  return c[0][1] > 1 ? c[0][0] : ",";
}
function parseDelimited(text, delimiter) {
  const rows = []; let row = [], field = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i+1] === '"') { field += '"'; i++; } else q = false; } else field += ch; continue; }
    if (ch === '"') q = true;
    else if (ch === delimiter) { row.push(field); field = ""; }
    else if (ch === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
    else if (ch !== "\r") field += ch;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ""));
}
async function readFile(file) {
  if (/\.xlsx?$/i.test(file.name)) {
    if (typeof XLSX === "undefined") throw new Error("Spreadsheet reader didn't load — save the file as CSV and try again.");
    const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
    return wb.SheetNames.flatMap(n => XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, blankrows: false, raw: false }))
      .map(r => r.map(c => String(c ?? "")));
  }
  const text = (await file.text()).replace(/^﻿/, "");
  return parseDelimited(text, detectDelimiter(text.split("\n")[0] || ""));
}
function toCsv(rows) {
  const e = v => /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  return rows.map(r => r.map(e).join(",")).join("\r\n") + "\r\n";
}

/* ---------- email ---------- */
const EMAIL_RE = /^[A-Za-z0-9._%+'-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}$/;
const FIXES = {"gmail.co":"gmail.com","gmail.con":"gmail.com","gmial.com":"gmail.com","gmai.com":"gmail.com","gmail.comm":"gmail.com","gnail.com":"gmail.com","yahoo.co":"yahoo.com","yaho.com":"yahoo.com","hotmai.com":"hotmail.com","hotmial.com":"hotmail.com","outlok.com":"outlook.com"};
const ROLES = new Set(["info","admin","support","sales","contact","hello","help","office","team","enquiries","inquiries","careers","hr","billing","accounts","noreply","no-reply","donotreply","postmaster","webmaster","mail","marketing","service","services","feedback","press","media"]);
function extractEmail(raw) {
  const s = String(raw).replace(/^mailto:/i, "").trim();
  const m = s.match(/<([^>]+)>/);
  const c = (m ? m[1] : s).trim().replace(/^[<("']+|[>)"',.;]+$/g, "");
  const p = c.split("@");
  if (p.length !== 2) return null;
  const email = p[0] + "@" + (FIXES[p[1].toLowerCase()] || p[1].toLowerCase());
  return EMAIL_RE.test(email) ? email.toLowerCase() : null;
}
function dedupeKey(email) {
  const [local, domain] = email.split("@");
  const g = domain === "gmail.com" || domain === "googlemail.com";
  const key = g ? local.split("+")[0].replace(/\./g, "") : local.split("+")[0];
  return key + "@" + (g ? "gmail.com" : domain);
}
const PROVIDERS = {"gmail.com":"Google","googlemail.com":"Google","outlook.com":"Microsoft","hotmail.com":"Microsoft","hotmail.co.uk":"Microsoft","live.com":"Microsoft","msn.com":"Microsoft","yahoo.com":"Yahoo","yahoo.co.uk":"Yahoo","ymail.com":"Yahoo","rocketmail.com":"Yahoo","aol.com":"Yahoo","icloud.com":"Apple","me.com":"Apple","mac.com":"Apple","proton.me":"Proton","protonmail.com":"Proton","pm.me":"Proton","zoho.com":"Zoho","gmx.com":"GMX","mail.com":"GMX","yandex.com":"Yandex"};

/* ---------- names ---------- */
const PARTICLES = new Set(["de","da","van","von","der","del","di","la","le","bin","al"]);
const TITLES = /^(mr|mrs|ms|miss|dr|prof|engr|barr|rev|sir|chief)\.?$/i;
function titleCase(w) {
  if (!w) return w;
  const l = w.toLowerCase();
  return PARTICLES.has(l) ? l : l.replace(/(^|['\-])([a-z])/g, (_m, s, c) => s + c.toUpperCase());
}
function splitFullName(full) {
  let n = String(full).replace(/\s+/g, " ").trim();
  if (!n) return ["", ""];
  if (n.includes(",")) { const [a, b] = n.split(",").map(x => x.trim()); if (b) n = b + " " + a; }
  const parts = n.split(" ").filter(p => p && !TITLES.test(p));
  if (!parts.length) return ["", ""];
  if (parts.length === 1) return [titleCase(parts[0]), ""];
  const rest = parts.slice(1);
  const i = rest.findIndex(p => PARTICLES.has(p.toLowerCase()));
  return [titleCase(parts[0]), (i >= 0 ? rest.slice(i) : [rest[rest.length - 1]]).map(titleCase).join(" ")];
}
function nameFromEmail(email) {
  const parts = email.split("@")[0].split("+")[0].split(/[._\-]+/).map(p => p.replace(/\d+/g, "")).filter(p => p.length > 1);
  if (!parts.length) return ["", ""];
  if (parts.length === 1) return [titleCase(parts[0]), ""];
  return [titleCase(parts[0]), parts.slice(1).map(titleCase).join(" ")];
}

/* ---------- columns ---------- */
const ALIASES = {
  email: ["email","email address","e-mail","mail","emailaddress","work email"],
  fullName: ["name","full name","fullname","participant","participant name","contact","contact name"],
  firstName: ["first name","firstname","first","given name","fname"],
  lastName: ["last name","lastname","last","surname","family name","lname"],
  company: ["company","organisation","organization","org","business","employer"]
};

/* ---------- pipeline ---------- */
function sort(rows) {
  if (!rows.length) return { leads: [], duplicates: 0, unusable: 0, rowCount: 0 };
  const hasHeader = !rows[0].some(c => c.includes("@"));
  const cols = {};
  if (hasHeader) rows[0].forEach((raw, i) => {
    const k = raw.trim().toLowerCase();
    for (const f in ALIASES) if (cols[f] === undefined && ALIASES[f].includes(k)) cols[f] = i;
  });
  const body = hasHeader ? rows.slice(1) : rows;

  const found = [];
  let unusable = 0;
  for (const row of body) {
    const cell = i => (i === undefined ? "" : String(row[i] ?? "").trim());
    let email = cell(cols.email) ? extractEmail(cell(cols.email)) : null;
    if (!email) for (const v of row) { const e = extractEmail(v); if (e) { email = e; break; } }
    if (!email) { unusable++; continue; }

    let first = cell(cols.firstName), last = cell(cols.lastName);
    if (first) { first = titleCase(first); last = last.split(" ").map(titleCase).join(" "); }
    else {
      const full = cell(cols.fullName) || (hasHeader ? "" : (row.find(v => String(v).trim() && !String(v).includes("@")) || ""));
      const [f, l] = splitFullName(full);
      first = f; last = last || l;
    }
    if (!first) { const [f, l] = nameFromEmail(email); first = f; last = last || l; }

    const domain = email.split("@")[1];
    found.push({ email, first, last, company: cell(cols.company), domain,
      provider: PROVIDERS[domain] || "Company / other",
      role: ROLES.has(email.split("@")[0]) });
  }

  const seen = new Map();
  let duplicates = 0;
  const score = l => (l.first ? 1 : 0) + (l.last ? 1 : 0) + (l.company ? 1 : 0);
  for (const lead of found) {
    const k = dedupeKey(lead.email);
    const prev = seen.get(k);
    if (!prev) seen.set(k, lead);
    else { duplicates++; if (score(lead) > score(prev)) seen.set(k, lead); }
  }
  return { leads: [...seen.values()].sort((a, b) => a.email.localeCompare(b.email)), duplicates, unusable, rowCount: body.length };
}

/* ---------- output ---------- */
const HEAD = ["Email","FirstName","LastName","FullName","Company","Domain","Provider"];
const rowsFor = leads => [HEAD, ...leads.map(l =>
  [l.email, l.first, l.last, [l.first, l.last].filter(Boolean).join(" "), l.company, l.domain, l.provider])];
function download(name, text) {
  const url = URL.createObjectURL(new Blob([text], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "list";

let state = { leads: [], duplicates: 0, unusable: 0, rowCount: 0, mode: "domain" };

const sending = () => state.leads.filter(l => !($("skip-roles").checked && l.role));

function groups() {
  const map = new Map();
  for (const l of sending()) {
    const key = state.mode === "domain" ? l.domain : l.provider;
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(l);
  }
  return [...map.entries()].sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0]));
}

function render() {
  $("results").hidden = false;
  const g = groups();
  const list = sending();
  const roles = state.leads.filter(l => l.role).length;

  $("stats").innerHTML = [
    ["Emails", list.length, ""],
    [state.mode === "domain" ? "Domains" : "Providers", g.length, ""],
    ["Duplicates removed", state.duplicates, ""],
    ["Rows with no email", state.unusable, state.unusable ? "flag" : ""]
  ].map(([k, n, c]) => `<div class="stat ${c}"><span class="n">${n}</span><span class="k">${k}</span></div>`).join("");

  $("groups").innerHTML =
    `<thead><tr><th>${state.mode === "domain" ? "Domain" : "Provider"}</th><th style="text-align:right">Emails</th><th></th></tr></thead><tbody>` +
    g.map(([key, leads], i) => {
      const roleCount = leads.filter(l => l.role).length;
      const tag = roleCount ? `<span class="tag">${roleCount} shared</span>` : "";
      return `<tr><td class="name">${esc(key)}${tag}</td><td class="num">${leads.length}</td>` +
        `<td class="act"><button type="button" class="mini" data-dl="${i}">Download</button>` +
        `<button type="button" class="mini" data-copy="${i}">Copy</button></td></tr>`;
    }).join("") + "</tbody>";

  const cols = HEAD.join(", ");
  const roleNote = roles
    ? ` ${roles} shared inbox${roles === 1 ? "" : "es"} (info@, hr@) found — tick the box to leave ${roles === 1 ? "it" : "them"} out.`
    : "";
  $("msg").textContent = `Every file is ready to import into SuperMailer — columns: ${cols}.` + roleNote;
  $("msg").className = "msg";
}

function copyText(button, text) {
  navigator.clipboard.writeText(text).then(() => {
    const t = button.textContent; button.textContent = "Copied";
    setTimeout(() => { button.textContent = t; }, 1400);
  }, () => { button.textContent = "Blocked"; });
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const g = groups();
  const dl = e.target.closest("[data-dl]");
  if (dl) { const [key, leads] = g[dl.dataset.dl]; return download(slug(key) + ".csv", toCsv(rowsFor(leads))); }
  const cp = e.target.closest("[data-copy]");
  if (cp) { const [, leads] = g[cp.dataset.copy]; return copyText(cp, toCsv(rowsFor(leads))); }
});
$("all-dl").addEventListener("click", () => download("supermailer-all.csv", toCsv(rowsFor(sending()))));
$("all-copy").addEventListener("click", e => copyText(e.target, toCsv(rowsFor(sending()))));
$("skip-roles").addEventListener("change", render);
$("by-domain").addEventListener("click", () => setMode("domain"));
$("by-provider").addEventListener("click", () => setMode("provider"));
function setMode(mode) {
  state.mode = mode;
  $("by-domain").setAttribute("aria-pressed", String(mode === "domain"));
  $("by-provider").setAttribute("aria-pressed", String(mode === "provider"));
  render();
}

async function handle(file) {
  try {
    const result = sort(await readFile(file));
    if (!result.leads.length) {
      $("results").hidden = false;
      $("groups").innerHTML = "";
      $("stats").innerHTML = "";
      $("msg").textContent = "No email addresses found in that file.";
      $("msg").className = "msg bad";
      return;
    }
    state = { ...result, mode: state.mode };
    render();
  } catch (err) {
    $("results").hidden = false;
    $("msg").textContent = err.message || "Couldn't read that file.";
    $("msg").className = "msg bad";
  }
}

const input = document.createElement("input");
input.type = "file";
input.accept = ".csv,.tsv,.txt,.xlsx,.xls";
input.addEventListener("change", () => { if (input.files[0]) handle(input.files[0]); });
const drop = $("drop");
drop.addEventListener("click", () => input.click());
drop.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } });
["dragenter","dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
drop.addEventListener("dragleave", e => { if (!drop.contains(e.relatedTarget)) drop.classList.remove("over"); });
drop.addEventListener("drop", e => {
  e.preventDefault(); drop.classList.remove("over");
  if (e.dataTransfer.files[0]) handle(e.dataTransfer.files[0]);
});

/* sample so the page opens showing what it does */
handle(new File([`Name,Email Address,Company
Jane Doe,JANE.DOE@Gmail.com,Acme
"Okonkwo, Chidi",c.okonkwo+2025@gmail.com,
Dr. Ada Lovelace,ada@northgate.io,Northgate
,chinedu.okafor21@yahoo.co,
Mary-Jane O'Brien,"Mary Jane <mj@outlook.com>",
Info Desk,info@northgate.io,Northgate
Broken Row,not-an-email,
Ngozi van der Berg,ngozi@bergco.ng,Berg & Co
janedoe@gmail.com,,
Tunde Bakare,tunde@bergco.ng,Berg & Co
Amaka Eze,amaka.eze@hotmail.com,
Samuel Oyelaran,sam.oyelaran@gmail.com,`], "sample.csv"));
</script>
</body>
</html>
